    statement: "Expose POST /api/v1/jobs nhận concept string và optional VideoConfig, trả về job_id + status pending."
    source_evidence: [EVD-001, EVD-002, EVD-017]
    priority: must

  - id: REQ-002
    statement: "Expose GET /api/v1/jobs trả về danh sách tất cả jobs với status và metadata."
    source_evidence: [EVD-002]
    priority: must

  - id: REQ-003
    statement: "Expose GET /api/v1/jobs/{job_id} trả về full job detail kèm artifact_url khi complete."
    source_evidence: [EVD-002]
    priority: must

  - id: REQ-004
    statement: "Expose GET /api/v1/jobs/{job_id}/artifact phục vụ file MP4 hoặc redirect đến static URL."
    source_evidence: [EVD-002, EVD-003]
    priority: must

  - id: REQ-005
    statement: "Job lifecycle được điều phối bởi LangGraph StateGraph với các node: generate_script → validate_script → generate_audio → generate_slides → assemble_video. Các chunks được xử lý song song (fan-out/fan-in) trên audio và slide nodes."
    source_evidence: [EVD-011, EVD-002, EVD-017]
    priority: must

  - id: REQ-006
    statement: "Job state được lưu bằng SQLAlchemy; engine default là SQLite (file-based). Job table chứa: job_id, concept, config (JSON), status, error_reason, artifact_path, retry_count, created_at, updated_at."
    source_evidence: [EVD-012, EVD-015, EVD-017]
    priority: must

  - id: REQ-007
    statement: "Hệ thống sử dụng JobQueue abstraction với AsyncioWorkerQueue (in-process worker pool, concurrency limiter) để điều phối render video, không làm nghẽn API request."
    source_evidence: [EVD-013, EVD-019]
    priority: must

  - id: REQ-008
    statement: "Node generate_script sử dụng 100% Structured Output (with_structured_output + Pydantic schema). Node validate_script kiểm tra tính toàn vẹn nghiệp vụ. Nếu fail: retry tối đa 2 lần; sau max retry: job status = failed với error_reason rõ ràng."
    source_evidence: [EVD-006, EVD-018]
    priority: must

  - id: REQ-009
    statement: "Artifact là file MP4 hợp lệ với audio narration và visual slides đồng bộ thời lượng per chunk; lưu tại artifacts/{job_id}.mp4."
    source_evidence: [EVD-003, EVD-017]
    priority: must

  - id: REQ-010
    statement: "LLM provider được inject qua interface (LangChain BaseChatModel); test dùng mock (FakeListChatModel), production dùng Codex (OpenAI-compatible) hoặc ChatAnthropic (claude-haiku-4-5-20251001)."
    source_evidence: [EVD-008, EVD-011, EVD-016]
    priority: must

  - id: REQ-011
    statement: "VideoAssembler là interface; production dùng FFmpegAssembler (Pillow + gTTS/pyttsx3 + ffmpeg), test dùng MockAssembler."
    source_evidence: [EVD-007, EVD-006]
    priority: must

  - id: REQ-012
    statement: "README.md bao gồm: prerequisites, install, run, API examples (curl), test instructions."
    source_evidence: [EVD-009]
    priority: must

