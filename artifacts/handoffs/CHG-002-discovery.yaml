# ---------------------------------------------------------------------------
# LangGraph Pipeline & Queue Design
# ---------------------------------------------------------------------------
# VideoConfig (Pydantic):
#   target_duration_sec: int = 60
#   target_audience: str = "high_school"
#   aspect_ratio: str = "16:9"
#   resolution: tuple[int, int] = (1280, 720)
#   language: str = "vi"
#   voice_gender: str = "neutral"
#
# ScriptChunk (Pydantic):
#   chunk_id: int
#   heading: str
#   narration: str
#   visual_notes: str
#   duration_hint_sec: int | None
#
# VideoScript (Pydantic - Structured Output):
#   title: str
#   summary: str
#   chunks: list[ScriptChunk]
#
# VideoGenerationState (TypedDict):
#   job_id: str
#   concept: str
#   config: VideoConfig
#   script: VideoScript | None   # output của script_node via with_structured_output
#   audio_paths: list[str]       # output của audio_node (parallel per chunk)
#   slide_paths: list[str]       # output của slides_node (parallel per chunk)
#   artifact_path: str | None    # output của assembler_node
#   retry_count: int
#   error_reason: str | None
#   status: str
#
# Graph topology:
#   START → generate_script → validate_script → [PASS] → generate_audio
#                                             → [FAIL, retry<2] → generate_script
#                                             → [FAIL, retry>=2] → mark_failed → END
#   generate_audio (parallel chunks) → generate_slides (parallel chunks) → assemble_video → mark_complete → END
#
# Queue Architecture:
#   POST /jobs → DB create(status=pending) → JobQueue.enqueue(job_id)
#   AsyncioWorkerQueue (Lifespan background worker pool with semaphore concurrency control)
#   Worker pop job_id → run_pipeline(job_id) với async_session_factory context manager
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Options (required for architectural mode)
# ---------------------------------------------------------------------------
options:
  - id: OPT-A
    summary: "LangGraph StateGraph + SQLAlchemy async + JobQueue (AsyncioWorkerQueue) + Structured Output (RECOMMENDED)"
    affected_boundaries: [Pipeline orchestration, Persistence, Queue/Workers, LLM Protocol]
    benefits:
      - LangGraph cho phép express retry/branch logic dạng graph — dễ đọc, dễ test từng node
      - Pydantic Structured Output loại bỏ 100% lỗi parse JSON và regex không an toàn
      - JobQueue interface phân tách rõ ràng API layer và Worker pool, kiểm soát concurrency tải render
      - Chunk parallel processing tăng tốc độ render đáng kể
      - SQLAlchemy async session độc lập trong worker tránh race conditions
      - BaseChatModel interface cho phép swap provider (Codex ↔ Anthropic ↔ mock)
    costs:
      - Cần thêm module queue abstraction (~50 LOC)
      - SQLAlchemy async cần quản lý session lifecycle đúng chuẩn
    risks:
      - RSK-001: Process restart khi job đang generating → job bị stuck ở "generating"
        Mitigation: Khi startup, reset tất cả job có status "generating" về "failed" với error_reason "server_restart"
    reversibility: high — graph topology, worker pool, LLM provider đều swap được độc lập
    verification_impact: "Mỗi node và worker test được độc lập với mock state; không cần real API hay external broker"
    estimated_cost_per_video: "<$0.01 (Claude Haiku / Codex + local assembly)"

  - id: OPT-B
    summary: "Custom orchestrator + in-memory dict + BackgroundTasks + Regex parsing"
    affected_boundaries: [Pipeline orchestration, Persistence, LLM Protocol]
    benefits:
      - Đơn giản hơn về số lượng module
    costs:
      - Regex parse JSON rất dễ gãy (brittle)
      - Không kiểm soát được tải render (concurrency)
      - In-memory dict không query được sau restart
    risks:
      - Model format lạ dẫn tới sập pipeline
    reversibility: medium
    estimated_cost_per_video: "<$0.01"

recommended_option: OPT-A
recommendation_rationale: >
  OPT-A đáp ứng toàn bộ chỉ đạo kỹ thuật: Structured Output type-safe (không regex),
  Queue worker pool kiểm soát tải, Chunking song song, và SQLAlchemy độc lập trong worker.

# ---------------------------------------------------------------------------
# Proposed decisions
# ---------------------------------------------------------------------------
proposed_decisions:
  - id: DEC-001
    decision: "Dùng LangGraph StateGraph làm pipeline orchestrator với 5 nodes (generate_script, validate_script, generate_audio, generate_slides, assemble_video)."
    rationale: "User decision (EVD-011). Biểu diễn retry branch và flow state rõ ràng."

  - id: DEC-002
    decision: "Dùng SQLAlchemy 2.0 async với aiosqlite + SQLite cho persistence."
    rationale: "User decision (EVD-012). JobRepository là sole writer."

  - id: DEC-003
    decision: "Xây dựng JobQueue abstract interface với AsyncioWorkerQueue (worker pool có concurrency control) cho in-process execution, sẵn sàng scale sang Redis/Celery."
    rationale: "EVD-013. Tách biệt Web API và Video Renderer, ngăn chặn quá tải CPU/RAM."

  - id: DEC-004
    decision: "Khi server startup, reset tất cả job có status 'generating' về 'failed' với error_reason 'server_restart'."
    rationale: "Mitigate RSK-001: job stuck sau process restart."

  - id: DEC-005
    decision: "LLM provider inject qua LangChain BaseChatModel; chọn provider theo env vars qua llm_factory.build_llm(): Codex (ChatOpenAI + CODEX_API_BASE) là primary, ChatAnthropic (claude-haiku-4-5-20251001 + ANTHROPIC_API_KEY) là fallback; test dùng FakeListChatModel."
    rationale: "EVD-016. Codex không tốn API cost trong dev; Anthropic làm fallback."

  - id: DEC-006
    decision: "Sử dụng LangChain with_structured_output(VideoScript) dựa trên Pydantic v2. Tuyệt đối KHÔNG dùng regex để parse markdown/JSON. Validator kiểm tra logic nghiệp vụ (len(chunks) >= 3, title/narration non-empty)."
    rationale: "EVD-018. Đảm bảo 100% type-safety và format reliability."

  - id: DEC-007
    decision: "API versioned tại /api/v1/; JobCreate hỗ trợ concept và optional VideoConfig."
    rationale: "EVD-008, EVD-017. Cho phép tùy biến thông số video hoặc dùng defaults."

  - id: DEC-008
    decision: "Kịch bản video được chia thành các Chunks (ScriptChunk); audio_node và slides_node xử lý song song các chunks (fan-out) trước khi gom lại (fan-in) cho assembler_node."
    rationale: "EVD-017. Tối ưu thời gian render và phân phối tải worker."

  - id: DEC-009
    decision: "Background worker tự tạo DB session độc lập qua async with async_session_factory(), không nhận session từ HTTP request."
    rationale: "EVD-019. Tránh race condition và lỗi session closed sau khi HTTP response hoàn tất."

