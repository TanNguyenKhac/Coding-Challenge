# ---------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------
scope:
  in:
    - FastAPI app với 4 endpoints (versioned: /api/v1/)
    - VideoConfig schema & request customization với sensible chemistry defaults
    - SQLAlchemy models + migration (Alembic create_all cho MVP)
    - JobRepository (single writer cho DB state, async context manager session per worker)
    - JobQueue abstraction + AsyncioWorkerQueue (in-process worker pool, concurrency control)
    - LangGraph StateGraph pipeline: 5 nodes (generate_script, validate_script, generate_audio, generate_slides, assemble_video)
    - ScriptChunk & VideoScript Pydantic models cho 100% Structured Output (zero regex)
    - Parallel chunk processing (fan-out/fan-in) trong audio_node và slides_node
    - LLM Factory (Codex primary, Anthropic fallback, Mock test)
    - VideoAssembler interface + FFmpegAssembler (Pillow + gTTS/pyttsx3 + ffmpeg) + MockAssembler (test)
    - Static file mount cho artifacts/
    - Unit tests: job lifecycle, LangGraph node logic, validation/retry, queue concurrency
    - Integration test: smoke test 3 required queries
    - README.md và ARCHITECTURE.md
    - 3 pre-generated sample videos committed vào artifacts/samples/
  out:
    - Frontend
    - External Redis/Celery infrastructure (đã có interface JobQueue sẵn sàng)
    - Alembic migration files (dùng create_all cho MVP)
    - Authentication/authorization
    - PostgreSQL (SQLite đủ cho MVP; boundary rõ ràng để upgrade)
    - Streaming/websocket real-time progress
    - Support STEM topics ngoài chemistry (extensibility qua prompt/config — in scope; thực tế support — out)
    - Docker/containerization

