# ---------------------------------------------------------------------------
# Risks and mitigations
# ---------------------------------------------------------------------------
risks:
  - id: RSK-001
    statement: "Process restart khi job đang generating → job bị stuck ở 'generating'."
    mitigation: "DEC-004: startup event reset tất cả 'generating' job về 'failed' với error_reason 'server_restart'."

  - id: RSK-002
    statement: "LangGraph API version thay đổi."
    mitigation: "Pin version langgraph>=0.2 trong requirements.txt."

  - id: RSK-003
    statement: "ffmpeg không có trên host machine của reviewer/test environment."
    mitigation: "MockAssembler cho test; FFmpegAssembler chỉ chạy trong smoke test/production."

  - id: RSK-004
    statement: "gTTS gặp rate limit hoặc mất kết nối internet."
    mitigation: "pyttsx3 offline fallback tự động khi gTTS fail. Chunk worker retry độc lập per chunk."

  - id: RSK-005
    statement: "SQLAlchemy async session leak trong background worker."
    mitigation: "Async context manager (async with async_session_factory()) độc lập cho mỗi job execution."

  - id: RSK-006
    statement: "Timebox 120 phút tight cho 9 WP."
    mitigation: "Tách rõ MockAssembler vs FFmpegAssembler, cấu trúc WP có thể chạy độc lập."

# ---------------------------------------------------------------------------
# Limitations
# ---------------------------------------------------------------------------
limitations:
  - "In-process queue mất pending jobs khi process restart (mitigated bởi DEC-004 cho generating jobs)."
  - "SQLite concurrency thích hợp cho local dev/demo; kiến trúc JobQueue và SQLAlchemy sẵn sàng upgrade lên PostgreSQL + Redis."
  - "Video quality là programmatic slides + TTS audio — tối ưu cho cost và reliability."
  - "Không có authentication — single-user local demo."

design_refs:
  - docs/plans/active/CHG-002-langgraph-sqlalchemy-mvp.md

self_review: passed
next_gate: H1
