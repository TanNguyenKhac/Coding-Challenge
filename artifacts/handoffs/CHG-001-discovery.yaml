# ---------------------------------------------------------------------------
# Requirements
# ---------------------------------------------------------------------------
requirements:
  - id: REQ-001
    statement: "Expose a POST /jobs endpoint accepting a chemistry concept query string and returning a job_id with status 'pending'."
    source_evidence: [EVD-001, EVD-002]
    priority: must

  - id: REQ-002
    statement: "Expose a GET /jobs endpoint returning all jobs with their current status."
    source_evidence: [EVD-002]
    priority: must

  - id: REQ-003
    statement: "Expose a GET /jobs/{job_id} endpoint returning full job detail including status and artifact_url when complete."
    source_evidence: [EVD-002]
    priority: must

  - id: REQ-004
    statement: "Expose a GET /jobs/{job_id}/artifact endpoint (or file serve) allowing retrieval of the completed video file."
    source_evidence: [EVD-002, EVD-003]
    priority: must

  - id: REQ-005
    statement: "Run video generation asynchronously (background task); job status transitions: pending → generating → complete | failed."
    source_evidence: [EVD-002]
    priority: must

  - id: REQ-006
    statement: "Generated artifact must be a video file (MP4) containing visual slides and synthesized audio narration."
    source_evidence: [EVD-003]
    priority: must

  - id: REQ-007
    statement: "Pipeline must handle the three required chemistry queries end-to-end reliably."
    source_evidence: [EVD-004]
    priority: must

  - id: REQ-008
    statement: "Pipeline must validate LLM script output before proceeding; retry up to 2 times on validation failure; set job to 'failed' with reason on exhaustion."
    source_evidence: [EVD-008]
    priority: must

  - id: REQ-009
    statement: "Artifacts and job state are persisted in-memory and to a local artifacts/ directory; boundary must be explicit (a single JobStore class)."
    source_evidence: [EVD-005]
    priority: must

  - id: REQ-010
    statement: "Generation boundary must be a provider-pattern interface so real AI/video providers can be swapped in without changing job orchestration."
    source_evidence: [EVD-006, EVD-011]
    priority: must

  - id: REQ-011
    statement: "README.md must contain setup, run, API, and test instructions. Architecture note must describe job lifecycle, persistence boundary, and AI/video boundary."
    source_evidence: [EVD-012]
    priority: must

  - id: REQ-012
    statement: "Cost per generated video must be documented; the chosen pipeline must explain what was optimized for."
    source_evidence: [EVD-007]
    priority: must

# ---------------------------------------------------------------------------
# Acceptance criteria
# ---------------------------------------------------------------------------
acceptance_criteria:
  - id: AC-001
    requirement_ids: [REQ-001]
    observable_result: "POST /jobs with body {\"concept\": \"How does the pH scale work?\"} returns HTTP 201 with {job_id, status: \"pending\"}."

  - id: AC-002
    requirement_ids: [REQ-002]
    observable_result: "GET /jobs returns a JSON array containing at least the submitted job with status visible."

  - id: AC-003
    requirement_ids: [REQ-003]
    observable_result: "GET /jobs/{job_id} after completion returns {job_id, concept, status: \"complete\", artifact_url}."

  - id: AC-004
    requirement_ids: [REQ-004]
    observable_result: "GET /jobs/{job_id}/artifact returns the MP4 file with Content-Type video/mp4."

  - id: AC-005
    requirement_ids: [REQ-005]
    observable_result: "Job transitions through pending → generating → complete without blocking the HTTP response. GET /jobs/{job_id} during generation returns status: \"generating\"."

  - id: AC-006
    requirement_ids: [REQ-006]
    observable_result: "Completed artifact is a valid MP4 file playable in a standard video player, with audio narration audible and at least one visual slide per concept section."

  - id: AC-007
    requirement_ids: [REQ-007]
    observable_result: "All three required queries complete with status: complete and a playable artifact in two consecutive independent runs."

  - id: AC-008
    requirement_ids: [REQ-008]
    observable_result: "When the LLM script validation fails, the job is retried automatically; after max retries the job status is 'failed' with a non-empty error_reason field."

  - id: AC-009
    requirement_ids: [REQ-009]
    observable_result: "JobStore is the sole in-memory and on-disk state writer; no other module writes to artifacts/ or modifies job state."

  - id: AC-010
    requirement_ids: [REQ-010]
    observable_result: "ScriptProvider and VideoProvider are abstract interfaces. A mock implementation passes tests without any real API keys. Swapping to a real provider requires only the provider module to change."

  - id: AC-011
    requirement_ids: [REQ-011]
    observable_result: "README.md is present and covers: pip install, uvicorn run command, curl examples for all four endpoints, and how to run tests."

  - id: AC-012
    requirement_ids: [REQ-012]
    observable_result: "Architecture note contains a cost table showing estimated cost per video for the chosen real provider and explains what was optimized for."

# ---------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------
scope:
  in:
    - FastAPI application with four endpoints (POST /jobs, GET /jobs, GET /jobs/{id}, GET /jobs/{id}/artifact)
    - Async background job orchestration (asyncio BackgroundTasks)
    - JobStore (in-memory + local files)
    - ScriptProvider interface + ClaudeScriptProvider (real) + MockScriptProvider (tests)
    - VideoProvider interface + FFmpegVideoProvider (real, uses TTS + slides) + MockVideoProvider (tests)
    - LLM script validation and retry logic (up to 2 retries)
    - Static file serving for artifacts
    - Unit tests covering job lifecycle and validation/retry logic
    - README.md and ARCHITECTURE.md
    - Three pre-generated sample videos committed to artifacts/samples/
  out:
    - Frontend or UI of any kind
    - Database (in-memory is sufficient per EVD-005)
    - Authentication or multi-tenant support
    - Streaming video or real-time progress websocket
    - Support for non-chemistry STEM topics (extensibility via provider pattern is in-scope; actual support is out)
    - Docker/containerization (local run only for MVP)

