# ---------------------------------------------------------------------------
# Verification contract
# ---------------------------------------------------------------------------
verification_contract:
  required_checks:
    - id: CHK-001
      description: "pytest tests/test_jobs.py — all HTTP endpoint tests pass"
      command: "pytest tests/test_jobs.py -v"
    - id: CHK-002
      description: "pytest tests/test_pipeline.py — validator and retry tests pass"
      command: "pytest tests/test_pipeline.py -v"
    - id: CHK-003
      description: "End-to-end smoke: POST all three required concepts; poll until complete; download artifacts"
      command: "python scripts/smoke_test.py"
    - id: CHK-004
      description: "All three artifact MP4 files are valid (non-zero, parseable by ffprobe)"
      command: "ffprobe artifacts/samples/*.mp4"
  acceptance_matrix:
    - ac: AC-001
      check: CHK-001
    - ac: AC-002
      check: CHK-001
    - ac: AC-003
      check: CHK-001
    - ac: AC-004
      check: CHK-001
    - ac: AC-005
      check: CHK-001
    - ac: AC-006
      check: CHK-004
    - ac: AC-007
      check: CHK-003
    - ac: AC-008
      check: CHK-002
    - ac: AC-009
      check: CHK-001
    - ac: AC-010
      check: CHK-002
    - ac: AC-011
      manual: "README.md reviewed against checklist"
    - ac: AC-012
      manual: "ARCHITECTURE.md reviewed for cost table"
  required_artifacts:
    - artifacts/samples/job-ph-scale.mp4
    - artifacts/samples/job-covalent-bonds.mp4
    - artifacts/samples/job-ionic-vs-covalent.mp4
    - README.md
    - ARCHITECTURE.md
  repeatability_policy: >
    Run scripts/smoke_test.py twice in sequence. Both runs must produce
    status: complete for all three concepts and valid MP4 artifacts.
    LLM non-determinism is contained by script validation + retry; if the second
    run fails validation repeatedly, that is a pipeline defect, not accepted variance.
  cost_evidence_policy: >
    ARCHITECTURE.md must include a cost table with: model name, estimated tokens
    per script generation call, cost per 1K tokens, estimated total cost per video.
    Values must be sourced from the provider's published pricing at time of writing.
  release_profile: local-demo

# ---------------------------------------------------------------------------
# External effects
# ---------------------------------------------------------------------------
external_effects:
  default: deny
  h2_triggers:
    - "Calling Anthropic API (ClaudeScriptProvider) — requires ANTHROPIC_API_KEY env var; approved as read-only LLM call, no data persistence at provider"
    - "Calling gTTS HTTP API — approved as read-only TTS call, no credentials required"

# ---------------------------------------------------------------------------
# Risks
# ---------------------------------------------------------------------------
risks:
  - id: RSK-001
    statement: "FFmpeg not installed on evaluator machine."
    mitigation: "MockVideoProvider allows all tests to pass without FFmpeg. README documents install step. CI can skip FFmpeg tests."
  - id: RSK-002
    statement: "gTTS rate-limited on rapid repeated calls during smoke tests."
    mitigation: "pyttsx3 offline fallback is tried automatically. Smoke test adds 1s delay between TTS calls."
  - id: RSK-003
    statement: "Claude Haiku returns malformed JSON in script generation."
    mitigation: "Validator catches this and triggers retry up to MAX_RETRIES=2. Prompt uses system instructions + json_object response format."
  - id: RSK-004
    statement: "120-minute timebox is tight for WP-04 (video assembly) and WP-06 (pre-generation)."
    mitigation: "MockVideoProvider produces a 1-frame valid MP4 stub that satisfies all AC except AC-006 visual quality. WP-06 can use pre-committed stubs if time runs out; real generation can be triggered post-submission."

# ---------------------------------------------------------------------------
# Limitations
# ---------------------------------------------------------------------------
limitations:
  - "In-memory job store is lost on process restart — acceptable per EVD-005."
  - "No authentication — single-user local demo only."
  - "Video quality is programmatic slides, not cinematic animation — optimized for cost and reliability over production aesthetics."

self_review: passed
next_gate: H1
