# ---------------------------------------------------------------------------
# Options (required for architectural mode)
# ---------------------------------------------------------------------------
options:
  - id: OPT-A
    summary: "Claude (Haiku) for script + gTTS audio + Pillow slides + FFmpeg MP4 assembly"
    affected_boundaries: [ScriptProvider, VideoProvider, artifacts/]
    benefits:
      - Cheapest Claude model for text; Haiku costs ~$0.0008/1K input tokens
      - gTTS is free (Google TTS HTTP API, no key for short text)
      - Pillow + FFmpeg are local — zero per-video cost for video assembly
      - Full control over slide layout and structure
      - No dependency on external video-generation providers that are expensive or rate-limited
    costs:
      - Slide generation is programmatic, not cinematic — visually basic
      - FFmpeg CLI must be installed on the host
      - gTTS requires internet; pyttsx3 is offline fallback
    risks:
      - gTTS rate-limit on repeated calls — mitigated by pyttsx3 fallback
      - FFmpeg not installed — documented prerequisite; test skips gracefully
    reversibility: high — ScriptProvider and VideoProvider are interfaces; swap real provider in one module
    verification_impact: "MockScriptProvider and MockVideoProvider allow all tests to run without API keys or FFmpeg"
    estimated_cost_per_video: "~$0.001–0.003 (Haiku LLM call) + $0 (local assembly) = <$0.01 total"

  - id: OPT-B
    summary: "Claude (Haiku) for script + ElevenLabs TTS + Remotion/Revideo for animated video"
    affected_boundaries: [ScriptProvider, VideoProvider, artifacts/]
    benefits:
      - Higher audio quality (ElevenLabs)
      - More cinematic animated output
    costs:
      - ElevenLabs costs $0.18–0.30 per 1K characters (~300 chars per slide × 5 slides = $0.27/video)
      - Remotion requires Node.js runtime and build step
      - Significantly more complex setup within 120-min timebox
    risks:
      - ElevenLabs key management; cost grows with retries
      - Remotion not installable without Node — hard external dependency
    reversibility: medium
    verification_impact: "Hard to mock ElevenLabs without a wrapper"
    estimated_cost_per_video: "~$0.30/video (ElevenLabs) + $0.003 (Haiku) = ~$0.30"

  - id: OPT-C
    summary: "OpenAI GPT-4o-mini for script + OpenAI TTS + FFmpeg assembly"
    affected_boundaries: [ScriptProvider, VideoProvider, artifacts/]
    benefits:
      - Single provider API (OpenAI) for both script and audio
    costs:
      - GPT-4o-mini is slightly more expensive than Haiku for comparable quality
      - OpenAI TTS costs $0.015/1K chars — more expensive than gTTS
      - Requires OpenAI API key separate from Anthropic key already in context
    risks:
      - Cost rises quickly on retries
    reversibility: high
    estimated_cost_per_video: "~$0.02/video"

recommended_option: OPT-A
recommendation_rationale: >
  OPT-A delivers all required outputs within the timebox at <$0.01/video.
  Claude Haiku is the cheapest capable model for structured script generation.
  Local FFmpeg + Pillow assembly eliminates per-video variable cost for video.
  gTTS provides free audio with a pyttsx3 offline fallback for reliability.
  The provider interface ensures OPT-B or OPT-C can replace the implementation
  without touching job orchestration. This is the right slice for the MVP.

# ---------------------------------------------------------------------------
# Architecture / Design
# ---------------------------------------------------------------------------
design_refs:
  - docs/plans/active/CHG-001-chemistry-video-mvp.md

# Component boundaries
#
# app/
#   main.py          — FastAPI app setup, static file mount, lifespan
#   routers/jobs.py  — four route handlers; delegates to JobStore and pipeline
#   models.py        — Pydantic models: JobCreate, JobResponse, JobStatus enum
#   store.py         — JobStore singleton (in-memory dict + artifact path resolver)
#   pipeline/
#     orchestrator.py  — async run_job(job_id): calls script_provider, validator,
#                        video_provider; handles retry loop; updates JobStore
#     script_provider.py — ScriptProvider ABC + ClaudeScriptProvider + MockScriptProvider
#     video_provider.py  — VideoProvider ABC + FFmpegVideoProvider + MockVideoProvider
#     validator.py       — validate_script(script_dict) -> bool + reason
#
# Failure and retry contract:
#   orchestrator retries script generation up to MAX_RETRIES=2 on ValidationError.
#   On exhaustion: job.status = "failed", job.error_reason = last validation message.
#   VideoProvider failure: job.status = "failed", job.error_reason = exception message.
#   All transitions are atomic within JobStore (single-threaded asyncio event loop).
#
# Script schema (dict validated by validator.py):
#   {
#     "title": str,
#     "sections": [{"heading": str, "narration": str, "visual_notes": str}],
#     "summary": str
#   }
#   Validation rules: min 3 sections, each narration >= 20 chars, title non-empty.
#
# Video assembly (FFmpegVideoProvider):
#   1. For each section: render Pillow slide image (1280×720, heading + visual_notes text)
#   2. TTS narration per section via gTTS (fallback: pyttsx3)
#   3. Combine slide image + audio into section clip via FFmpeg
#   4. Concatenate all section clips + title card + summary card into final MP4
#   Output: artifacts/{job_id}.mp4
#
# Static serving: FastAPI mounts artifacts/ at /artifacts — no custom endpoint needed
# for file download; GET /jobs/{id}/artifact redirects to /artifacts/{id}.mp4

# ---------------------------------------------------------------------------
# Proposed decisions
# ---------------------------------------------------------------------------
proposed_decisions:
  - id: DEC-001
    decision: "Use Claude claude-haiku-4-5-20251001 as the LLM for script generation (ClaudeScriptProvider)."
    rationale: "Cheapest capable Claude model. Fits provider interface. Swappable."
  - id: DEC-002
    decision: "Use gTTS with pyttsx3 offline fallback for text-to-speech."
    rationale: "gTTS is free and produces natural-sounding audio. pyttsx3 ensures reliability when gTTS is unavailable."
  - id: DEC-003
    decision: "Use Pillow for slide rendering and FFmpeg for MP4 assembly."
    rationale: "Zero per-video cost; full control; well-understood tools."
  - id: DEC-004
    decision: "Script validation requires min 3 sections, each narration >= 20 chars, non-empty title."
    rationale: "Minimum bar for coherent educational content. Retries on failure up to MAX_RETRIES=2."
  - id: DEC-005
    decision: "Job state is in-memory (dict) for MVP; artifact files persist to disk."
    rationale: "Acceptable per EVD-005. JobStore is the single owner of both."

